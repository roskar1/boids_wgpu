	const triShaderModule = device.createShaderModule({

		code: `

		const UINTMAX : f32 = 4294967295;

		struct VertexInput {
			@builtin(instance_index) instanceIndex: u32,
			@location(0) pos: vec2f,
		};

		struct VertexInputSmall {
			@builtin(instance_index) instanceIndex: u32,
			@location(0) pos: vec2f
		};

		struct VertexOutput {
			@builtin(position) position: vec4f,
			@location(0) color: vec4f,
		};

		struct sceneUniforms {
			mouseX : f32,
			mouseY : f32,
			zoom : f32,
			offsetX : f32,
			offsetY : f32,
		};


		// vec2f
		@group(0) @binding(0) var<storage, read> positions: array<vec2u>;
		@group(0) @binding(1) var<storage, read> velocities: array<vec2f>;
		@group(0) @binding(2) var<uniform> SceneUniforms: sceneUniforms;

		@vertex
		fn vertexMain(input: VertexInput) -> VertexOutput {

			let position : vec2f = worldToScreen(positions[input.instanceIndex]);
			let velocity : vec2f = velocities[input.instanceIndex];

			// Get the direction of the velocity vector and construct rotation matrix
			// The magnitude of the velocity does not matter
			let theta = atan2(velocity.y, velocity.x);
			let c = cos(theta);
			let s = sin(theta);


			//Rotation matrix
			let rotate = mat2x2f(vec2f(c, s), vec2f(-s, c));

			// Offset is already negative or positive correctly based on right/left
			var panVector : vec2f = position + vec2f(SceneUniforms.offsetX, SceneUniforms.offsetY);

			/*
			var color = array<vec4f, 3>(
				vec4f(1, 0, 0, 1),
				vec4f(0, 1, 0, 1),
				vec4f(0, 0, 1, 1),
			);
			*/
			
			var vsOutput: VertexOutput;

			vsOutput.position = vec4f
			(
				((rotate * input.pos / 1000) + (position + panVector)) * SceneUniforms.zoom,
				0.0, 
				1.0
			);

			//vsOutput.color = color[input.vertexIndex];
			return vsOutput;
		}

		fn worldToScreen(v : vec2u) -> vec2f {
			// When casting a u32 vector to a f32 vector, it must be explcit componentwise
			let new_vector : vec2f = vec2f(f32(v.x), f32(v.y));

			// returns a float vector between -1 and 1
			return (new_vector / (UINTMAX / 2.0)) - 1.0;
		}


		@vertex
		fn vertexMainSmall(input: VertexInputSmall) -> VertexOutput {

			var panVector = vec2f
			( 
				input.pos.x + SceneUniforms.offsetX,
				input.pos.y + SceneUniforms.offsetY 
			);

			var vsOutput:  VertexOutput;

			vsOutput.position = vec4f(0.0);
			vsOutput.color = vec4f(1, 1, 1, 1);

//// Compute Shader ///////////////////////////////////////////////////////////

	const computeModule = device.createShaderModule({
		label: "Compute Shader",
		code: `
			struct computeInput {
				@builtin(global_invocation_id) id: vec3u,
			};
			
			struct sceneUniforms {
				mouseX : f32,
				mouseY : f32,
				zoom : f32,
				offsetX : f32,
				offsetY : f32,
			};

			struct Boid {
				x : u32,
				y : u32,
				xv : f32,
				yv : f32,
			};

			struct cellIndexHelperStruct {
				cell : u32,
				indexWithinCell : u32,
			};

			struct cellStorageHelperStruct {
				cellStartIndex : u32,
				cellEndIndex : u32,
				count : u32,
			};

			struct cellContents { //Dynamically sized arrays must be at the end of structs in wgsl
				// count : u32,
				particles: array<Boid>,
			};

			// Temporary grid size
			const gridEdgeCount = 16;
			const totalCellCount = gridEdgeCount * gridEdgeCount;


			// So these can be workgroup buffers
			//var<storage, read_write> cellCounters: array<u32, totalCellCount>;
			//var<storage, read_write> cellStorage: array<cellStorageHelperStruct, totalCellCount>;

			var<workgroup> cellCounters: array<atomic<u32>, totalCellCount>;
			var<workgroup> cellStorage: array<cellStorageHelperStruct, totalCellCount>;

			// There a entries in this array equal to the total amount of cells. 
			// In each entry there is a dynamically sized array. The sum of 
			// the sizes of these arrays is equal to the number of objects.

			// This must be a storage buffer
			// Use offsets to 
			//var<storage, read_write> cellContentsArray: array<cellContents, totalCellCount>;

		
			// vec2f
			@group(0) @binding(0) var<storage, read> inputPositions: array<vec2u>;
			@group(0) @binding(1) var<storage, read_write> outputPositions: array<vec2u>;

			@group(0) @binding(2) var<storage, read> inputVelocities: array<vec2f>;
			@group(0) @binding(3) var<storage, read_write> outputVelocities: array<vec2f>;



			// vec4 implementation  - do this later
			// @group(0) @binding(0) var<storage, read> inputParticles: array<Boid>;
			// @group(0) @binding(1) var<storage, read_write> outputParticles: array<Boid>;


			@group(0) @binding(4) var<uniform> SceneUniforms: sceneUniforms;
			@group(0) @binding(5) var<storage, read_write> cellIndices: array<cellIndexHelperStruct>;
			@group(0) @binding(6) var<storage, read_write> cellContentsArray: array<Boid, totalCellCount>;


			@compute
			@workgroup_size(${WORKGROUP_SIZE}, 1, 1) // 1D workgroup
			fn computeMain(input: computeInput) {
				// All this does is update positions by a constant factor
				let i = input.id.x;
				outputPositions[i] = vec2u(vec2f(inputPositions[i]) + inputVelocities[i]);


				// Update Velocities to point towards mouse
				outputVelocities[i] = vec2f(
					(SceneUniforms.mouseX - f32(inputPositions[i].x)) / 10000.0, 
					(SceneUniforms.mouseY - f32(inputPositions[i].y)) / 10000.0
				);
			}
			
			// Do this once per boid
			@compute
			@workgroup_size(${WORKGROUP_SIZE}, 1, 1)
			fn count(input: computeInput) {
				let i = input.id.x;
				let cell = getCell(inputPositions[i]);

				cellIndices[i].cell = cell;
				cellIndices[i].indexWithinCell = atomicLoad(&cellCounters[cell]);
				atomicAdd(&cellCounters[cell], 1u); // Atomic add to avoid race
			}

			// Do this once per cell
			// If workgroup size is the number of cells this could work
			@compute
			@workgroup_size(${WORKGROUP_SIZE}, 1, 1)
			fn alloc(input: computeInput) {
				let i = input.id.x;
				var prefixSum: u32 = 0u;
				// The variable i here represents the cell id and not the boid
				let cellCount = atomicLoad(&cellCounters[i]);

				cellStorage[i].cellStartIndex = prefixSum;
				cellStorage[i].cellEndIndex = prefixSum + cellCount;
				cellStorage[i].count = cellCount;
				prefixSum += cellCount;
			}

			// Do this once per boid
			@compute
			@workgroup_size(${WORKGROUP_SIZE}, 1, 1)
			fn fill(input: computeInput) {
				let i = input.id.x;
				let cell = getCell(inputPositions[i]);
				let offset = cellStorage[cell].cellStartIndex + cellIndices[i].indexWithinCell;

				cellContentsArray[offset] = 
					Boid(
						inputPositions[i].x,
						inputPositions[i].y,
						inputVelocities[i].x,
						inputVelocities[i].y
					);
			}

			fn getCell(v: vec2u) -> u32 {
				let xPosition = v.x;
				let yPosition = v.y;

				// Use only log safe values for this
				let xCell = xPosition >> (32 - u32(log2(gridEdgeCount)));
				let yCell = yPosition >> (32 - u32(log2(gridEdgeCount)));

				return xCell + (yCell * gridEdgeCount);
			}	








			fn rand_sine(p: vec2f) -> f32 {
				return fract(sin(dot(p, vec2f(12.9898, 4.1414))) * 43758.5453);
			}
		`
	});

///////////////////////////////////////////////////////////////////////////////








////// Compute Shader Pipeline ////////////////////////////////////////////////

	const computePipeline = device.createComputePipeline({
		label: "Compute Shader Pipeline",
		layout: computePipelineLayout,
		compute: {
			module: computeModule,
			entryPoint: "computeMain",
		},
	});

///////////////////////////////////////////////////////////////////////////////

	const renderPassDescriptor = {
		label: "Canvas renderPass",
		colorAttachments: [{
			clearValue: [0, 0, 0, 1],
			loadOp: "clear",
			storeOp: "store",
		}],
	};

//////////////////////////////////////////////////////////////////////////////

	// Render pipeline Global Variables
	let step = 0;
	let multisampleTexture;



	// Render Function

	function render() {

		// Anti-aliasing Stuff
		// Grab the current texture from the canvas
		const canvasTexture = context.getCurrentTexture();

		// If the multisample texture doesn't exist or is the wrong size, then make]
		// a new one
		if (!multisampleTexture ||
			multisampleTexture.width !== canvasTexture.width ||
			multisampleTexture.height !== canvasTexture.height) {

			// If we have an existing multisample texture, destroy it.
			if (multisampleTexture) {
				multisampleTexture.destroy();
			}

			// Create a new multisample texture that matches canvas size
			multisampleTexture = device.createTexture({
				format: canvasTexture.format,
				usage: GPUTextureUsage.RENDER_ATTACHMENT,
				size: [canvasTexture.width, canvasTexture.height],
				sampleCount: 4,
			});
		}

		renderPassDescriptor.colorAttachments[0].view = 
			multisampleTexture.createView();

		renderPassDescriptor.colorAttachments[0].resolveTarget = 
			canvasTexture.createView();


		// Normal Render Stuff
		const encoder = device.createCommandEncoder();
		
		const pass = encoder.beginRenderPass(renderPassDescriptor);

		pass.setPipeline(vertexPipeline);
		pass.setBindGroup(0, vertexBindGroups[step % 2]);
		pass.setVertexBuffer(0, vertexBuffer);
		pass.draw(3, kNumObjects);

		pass.end();
		
		device.queue.submit([encoder.finish()]);
	}

	function renderSmall() {
		
		const encoder = device.createCommandEncoder();
		
		const pass = encoder.beginRenderPass({
			label: "Small render pass",
			colorAttachments: [{
				view: context.getCurrentTexture().createView(),
				loadOp: "clear",
				clearValue: { r: 0, g: 0, b: 0, a: 1 },
				storeOp: "store",
			}],
		});

		pass.setPipeline(vertexSmallPipeline);
		pass.setBindGroup(0, vertexBindGroups[step % 2]);
		pass.setVertexBuffer(0, vertexBuffer);
		pass.draw(1, kNumObjects);

		pass.end();
		
		device.queue.submit([encoder.finish()]);
	}

	// A separate  compute function for the compute shader
	function compute() {
		const encoder = device.createCommandEncoder({
			label: "Compute Encoder",
		});
		const pass = encoder.beginComputePass({
			label: "Compute Pass",
		});
		pass.setPipeline(computePipeline);
		// pass.setBindGroup(0, computeBindGroup);
		pass.setBindGroup(0, computeBindGroups[step % 2]);
		const workGroupCount = Math.ceil(kNumObjects / WORKGROUP_SIZE);

		pass.dispatchWorkgroups(workGroupCount);
		pass.end();

		device.queue.submit([encoder.finish()]);
	}
